  .nav-cta { display: none; }
  @media (min-width: 768px) { .nav-cta { display: inline-flex; } }

    .hero-bajtek { height: 380px; }
    .hero-inner .tips { max-width: none; }
  }

  /* Tips: four short cards about how AI works, each tied to the game that teaches it */

  .tips-kicker { color: var(--accent); }
  .tip-list { display: flex; flex-direction: column; gap: var(--space-100); }
  .tip {
    display: flex; align-items: flex-start; gap: var(--space-200); padding: var(--space-200) var(--space-300);
    border: 1px solid var(--line); border-radius: var(--radius-2xl); background: var(--bg);
    box-shadow: 0 24px 48px -32px rgba(25, 25, 25, 0.22);
    transition: border-color var(--dur-hover) var(--ease), transform var(--dur) var(--ease);
  }
  .tip:hover { border-color: var(--line-strong); transform: translateY(-2px); }
  .tip-icon { flex-shrink: 0; display: grid; place-items: center; width: 40px; height: 40px; border-radius: var(--radius-lg); background: var(--tint); color: var(--text); }
  .tip-copy { display: flex; flex-direction: column; gap: var(--space-25); min-width: 0; }
  .tip-link { margin-top: var(--space-50); color: var(--accent); text-decoration: none; display: inline-flex; align-items: center; gap: var(--space-50); width: fit-content; }
  .tip-link:hover { text-decoration: underline; text-underline-offset: 4px; }

  /* Sections */
  .section { padding-block: var(--space-700); scroll-margin-top: var(--space-800); }
  @media (min-width: 768px) { .section { padding-block: var(--space-900); } }
  .section-head { display: flex; flex-direction: column; gap: var(--space-200); max-width: 680px; margin-bottom: var(--space-600); }
  .section-cta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-100) var(--space-200); margin-top: var(--space-600); }

  /* Problem and fix: each everyday blunder next to the game that fixes it.
     Card radius 16 with 8 inside, so the tinted panel gets 8. */
  .fixes { display: flex; flex-direction: column; gap: var(--space-200); }
  .fix {
    display: grid; gap: var(--space-75); padding: var(--space-75);
    border: 1px solid var(--line); border-radius: var(--radius-2xl); background: var(--bg);
    transition: border-color var(--dur-hover) var(--ease);
  }
  .fix:hover { border-color: var(--line-strong); }
  @media (min-width: 768px) { .fix { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
  .fix-problem { display: flex; align-items: flex-start; gap: var(--space-200); padding: var(--space-300); }
  .fix-problem .icon { color: var(--muted); }
  .fix-solution { display: flex; align-items: center; gap: var(--space-200); padding: var(--space-200) var(--space-300); border-radius: var(--radius-lg); background: var(--tint); }
  .fix-solution img { flex-shrink: 0; width: auto; height: 88px; transform-origin: 50% 100%; transition: transform var(--dur) var(--ease); }
  .fix:hover .fix-solution img { transform: translateY(calc(var(--space-50) * -1)) rotate(-3deg); }
  .fix-copy { display: flex; flex-direction: column; gap: var(--space-50); }
  .fix-step { color: var(--on-tint); }
  .fix-name a { text-decoration: none; }
  .fix-name a:hover { text-decoration: underline; text-underline-offset: 4px; }

  /* Tagline reveal: each word goes from muted to full color as the section scrolls into view */
  .tagline { padding-block: var(--space-700); }
  @media (min-width: 768px) { .tagline { padding-block: var(--space-900); } }
  .tagline-text { max-width: 680px; margin-inline: auto; text-align: center; }
  /* One phrase per line; a phrase too long for a phone splits into balanced halves, never one lone word */
  .tl-line { display: block; text-wrap: balance; }
  .tagline .w { opacity: 0.3; transition: opacity var(--dur) var(--ease); }
  .tagline .w.on { opacity: 1; }

  /* How it works */
  .steps { display: grid; gap: var(--space-300); }
  @media (min-width: 768px) { .steps { grid-template-columns: repeat(3, 1fr); } }
  .step { display: flex; flex-direction: column; gap: var(--space-100); padding: var(--space-300); border-radius: var(--radius-2xl); background: var(--surface); }
  .step-icon { display: grid; place-items: center; width: 48px; height: 48px; margin-bottom: var(--space-200); border-radius: var(--radius-xl); background: var(--bg); }

  /* FAQ */
  .faq-grid { display: grid; gap: var(--space-600); }
  .faq-head { display: flex; flex-direction: column; gap: var(--space-200); }
  .faq-art { display: none; width: auto; height: 128px; margin-top: var(--space-300); }
  @media (min-width: 960px) {
    .faq-grid { grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: var(--space-800); align-items: start; }
    .faq-head { position: sticky; top: var(--space-900); }
    .faq-art { display: block; }
  }
  .faq-list { display: flex; flex-direction: column; gap: var(--space-75); }
  .faq-item { border: 1px solid var(--line); border-radius: var(--radius-xl); background: var(--bg); transition: border-color var(--dur-hover) var(--ease); }
  .faq-item:hover, .faq-item[open] { border-color: var(--line-strong); }
  .faq-item summary {
    display: flex; align-items: center; justify-content: space-between; gap: var(--space-200);
    padding: var(--space-200) var(--space-300); border-radius: var(--radius-xl); cursor: pointer; list-style: none;
  }
  .faq-item summary::-webkit-details-marker { display: none; }
  .faq-item summary .icon { color: var(--muted); transition: transform var(--dur) var(--ease), color var(--dur-hover) var(--ease); }
  .faq-item summary:hover .icon { color: var(--text); }
  .faq-item[open] summary .icon { transform: rotate(180deg); }
  .faq-answer { padding: 0 var(--space-300) var(--space-200); }
  .faq-answer a { color: var(--accent); text-underline-offset: 4px; }
  .faq-item[open] .faq-answer { animation: rise-in var(--dur) var(--ease); }

  /* Final call to action, identical to the top one */
  .final { padding-block: var(--space-300) var(--space-500); }
  .final-card {
    display: flex; flex-direction: column; align-items: center; gap: var(--space-300); text-align: center;
    padding: var(--space-700) var(--space-300); border-radius: var(--radius-3xl); background: var(--surface);
  }
  @media (min-width: 768px) { .final-card { padding: var(--space-800) var(--space-600); } }
  .final-card img { width: auto; height: 144px; }
  .final-card h2, .final-sub { max-width: 680px; }
  .assurances { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--space-100) var(--space-300); }
  .assurances li { display: flex; align-items: center; gap: var(--space-75); }
  .assurances .icon { color: var(--accent); }

  /* Mobile menu: the toggle's two lines turn into a cross, the panel covers the full height */
  .menu-toggle {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-50);
    width: 36px; height: 36px; border: 0; border-radius: var(--radius-lg); background: transparent; color: var(--text); cursor: pointer;
    transition: background-color var(--dur-hover) var(--ease);

  .menu-toggle:hover { background: var(--surface); }
  .menu-toggle span { display: block; width: 16px; height: 2px; border-radius: var(--radius-full); background: currentColor; transition: transform var(--dur) var(--ease); }
  .menu-open .menu-toggle span:first-child { transform: translateY(3px) rotate(45deg); }
  .menu-open .menu-toggle span:last-child { transform: translateY(-3px) rotate(-45deg); }
  .menu {
    position: fixed; inset: 0; z-index: 40; overflow-y: auto; padding-top: var(--space-900);
    background: var(--panel-bg); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
    opacity: 0; visibility: hidden; transition: opacity var(--dur) var(--ease), visibility 0s var(--ease) var(--dur);
  }
  .menu-open .menu { opacity: 1; visibility: visible; transition: opacity var(--dur) var(--ease); }
  .menu ul { display: flex; flex-direction: column; gap: var(--space-75); padding-top: var(--space-400); }
  .menu li { opacity: 0; transform: translateY(var(--space-300)); transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease); }
  .menu-open .menu li { opacity: 1; transform: none; transition-delay: var(--d); }
  .menu-link { display: block; padding-block: var(--space-75); text-decoration: none; }
  .menu-link[aria-current] { color: var(--accent); }
  .menu .btn { margin-top: var(--space-300); }

  .js .reveal { opacity: 0; transform: translateY(var(--space-400)); transition: opacity var(--dur-reveal) var(--ease), transform var(--dur-reveal) var(--ease); }
  .js .reveal.in { opacity: 1; transform: none; }
  .js .stagger > * { opacity: 0; }
  .js .stagger.in > * { opacity: 1; animation: rise var(--dur-reveal) var(--ease) backwards; animation-delay: calc(var(--i, 0) * 80ms); }
  .js .reveal.instant, .js .stagger.instant > * { transition: none; animation: none; }
  @keyframes rise { from { opacity: 0; transform: translateY(var(--space-400)); } }
  @keyframes fade { from { opacity: 0; } }

  .noscript { padding-top: var(--space-900); padding-bottom: var(--space-700); display: flex; flex-direction: column; gap: var(--space-200); }

  @media (prefers-reduced-motion: reduce) {
    .js .reveal { transform: none; }
    .js .stagger.in > *, .faq-item[open] .faq-answer { animation-name: fade; }
    .tagline .w { opacity: 1; transition: none; }
    .tip, .tip:hover { transition: none; transform: none; }
    .hero-bajtek { animation: none; }
    .menu li { transform: none; }
    .fix:hover .fix-solution img, .faq-item[open] summary .icon { transform: none; }
  }
</style>

// FAQ as structured data, for search and answer engines
function setFaqSchema() {
  let s = $("faq-schema");
  if (!s) {
    s = document.createElement("script");
    s.type = "application/ld+json";
    s.id = "faq-schema";
    document.head.appendChild(s);

  s.textContent = JSON.stringify({
    "@context": "https://schema.org",
    "@type": "FAQPage",
    inLanguage: lang,
    mainEntity: T.faq.map(([q, a]) => ({ "@type": "Question", name: q, acceptedAnswer: { "@type": "Answer", text: a } }))
  });
}

// Scroll reveals: each block rises and fades in once. A language switch does not replay them.
const revealed = new Set();
let revealObserver = null;
function setupReveals() {
  const els = document.querySelectorAll(".reveal, .stagger");
  if (!("IntersectionObserver" in window)) {
    els.forEach((el) => el.classList.add("in", "instant"));
    return;
  }
  if (revealObserver) revealObserver.disconnect();
  revealObserver = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (!entry.isIntersecting) return;
      entry.target.classList.add("in");
      revealed.add(entry.target.dataset.key);
      revealObserver.unobserve(entry.target);
    });
  }, { rootMargin: "0px 0px -10% 0px", threshold: 0.08 });
  els.forEach((el) => {
    if (revealed.has(el.dataset.key)) el.classList.add("in", "instant");
    else revealObserver.observe(el);
  });
}

// The navigation marks the section currently in view: the last one whose top has passed the middle
// of the screen. Every section is watched, so even a fast scroll that skips one still updates it.
let spyObserver = null;
function updateCurrent() {
  const mid = window.innerHeight / 2;
  let current = "";
  SECTIONS.forEach((id) => { const el = $(id); if (el && el.getBoundingClientRect().top <= mid) current = id; });
  document.querySelectorAll(".nav-link, .menu-link").forEach((a) => {
    if (current && a.getAttribute("href") === `#${current}`) a.setAttribute("aria-current", "location");
    else a.removeAttribute("aria-current");
  });
}
function setupSpy() {
  if (!("IntersectionObserver" in window)) return;
  if (spyObserver) spyObserver.disconnect();
  spyObserver = new IntersectionObserver(updateCurrent, { rootMargin: "-49% 0px -50% 0px" });
  document.querySelectorAll("main > section").forEach((el) => spyObserver.observe(el));
  updateCurrent();
}

// Tagline: words light up one at a time, in reading order, as the block scrolls through the viewport.
// One scroll listener, throttled with requestAnimationFrame.
let taglineEl = null;
let words = [];
let ticking = false;
function setupTagline() {
  taglineEl = $("tagline-text");
  words = taglineEl ? [...taglineEl.querySelectorAll(".w")] : [];
  updateTagline();
}
function updateTagline() {
  ticking = false;
  if (!taglineEl) return;
  if (reduceMotion.matches) {
    words.forEach((w) => w.classList.add("on"));
    return;
  }
  const r = taglineEl.getBoundingClientRect();
  const vh = window.innerHeight;
  const start = vh * 0.85;
  const end = vh * 0.6;
  const p = Math.min(1, Math.max(0, (start - r.top) / (start - end + r.height)));
  const lit = Math.round(p * words.length);
  words.forEach((w, i) => w.classList.toggle("on", i < lit));
}
function requestTagline() {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(updateTagline);
}
window.addEventListener("scroll", requestTagline, { passive: true });
window.addEventListener("resize", requestTagline);

// Mobile menu
const toggle = $("menu-toggle");
const menu = $("menu");
function setMenu(open) {
  root.classList.toggle("menu-open", open);
  toggle.setAttribute("aria-expanded", String(open));
  toggle.setAttribute("aria-label", open ? T.menuClose : T.menuOpen);
  menu.inert = !open;
  $("main").inert = open;
  $("footer").inert = open;
  root.style.overflow = open ? "hidden" : "";
  if (open) {
    const first = menu.querySelector("a");
    if (first) first.focus({ preventScroll: true });
  }
}
toggle.addEventListener("click", () => setMenu(!root.classList.contains("menu-open")));
menu.addEventListener("click", (e) => { if (e.target.closest("a")) setMenu(false); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && root.classList.contains("menu-open")) {
    setMenu(false);
    toggle.focus();
  }
});
window.matchMedia("(min-width: 768px)").addEventListener("change", (e) => { if (e.matches) setMenu(false); });

  $("skip").textContent = T.skip;
  $("nav").setAttribute("aria-label", T.navLabel);
  toggle.setAttribute("aria-label", root.classList.contains("menu-open") ? T.menuClose : T.menuOpen);
  document.querySelectorAll("#lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  try { localStorage.setItem("lang", lang); } catch (e) { /* storage unavailable */ }
  render();
}

document.querySelectorAll("#lang button").forEach((b) => b.addEventListener("click", () => setLang(b.dataset.lang)));

const urlLang = new URLSearchParams(location.search).get("lang");
setLang(urlLang === "en" || urlLang === "pl" ? urlLang : readSavedLang() || "pl");
</script>
</body>
</html>
