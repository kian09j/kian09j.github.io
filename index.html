<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>AI w pracy</title>
<meta name="description" content="Cztery krótkie gry, które uczą pracy z AI: jak AI pisze, jak pisać polecenia, jak sprawdzać odpowiedzi i jak chronić dane. Four short games that teach people to work with AI.">
<!-- Link preview for LinkedIn and other social sites -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://kian09j.github.io/">
<meta property="og:title" content="AI w pracy / AI at work">
<meta property="og:description" content="Cztery krótkie gry szkoleniowe o pracy z AI. PL / EN.">
<meta property="og:image" content="https://kian09j.github.io/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Robot Bajtek i tytuł serii AI w pracy">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Cpath d='M60 26V13' stroke='%2337352f' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='60' cy='10' r='8' fill='%23f5c84c' stroke='%2337352f' stroke-width='4'/%3E%3Crect x='10' y='26' width='100' height='84' rx='28' fill='%23ffffff' stroke='%2337352f' stroke-width='6'/%3E%3Crect x='24' y='42' width='72' height='52' rx='16' fill='%23f1f1ef' stroke='%2337352f' stroke-width='4'/%3E%3Cellipse cx='45' cy='66' rx='7' ry='10' fill='%2337352f'/%3E%3Cellipse cx='75' cy='66' rx='7' ry='10' fill='%2337352f'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #ffffff;
    --text: #37352f;
    --muted: #6b6a66;
    --faint: #8c8b87;
    --on-tint: #5a5853;
    --line: #e9e9e7;
    --hover: #f7f7f5;
    --gray: #f1f1ef;
    --blue: #1b6ab8;
    --blue-hover: #185fa6;
    --blue-bg: #e7f3f8;
    --blue-text: #2d73a0;
    --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", Helvetica, Arial, sans-serif, "Segoe UI Emoji", "Apple Color Emoji";
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.55;
    display: flex; justify-content: center; padding: 24px 16px 48px; overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .app { width: 100%; max-width: 760px; }
  a { color: var(--blue-text); }

  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding-bottom: 12px; margin-bottom: 8px; border-bottom: 1px solid var(--line);
  }
  .logo { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 6px; }
  .logo .ai {
    font-family: SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 85%;
    color: #eb5757; background: rgba(135, 131, 120, 0.15); border-radius: 4px; padding: 1px 5px;
  }
  .lang { display: flex; gap: 2px; background: var(--gray); border-radius: 6px; padding: 2px; }
  .lang button {
    font: inherit; font-size: 13px; font-weight: 500; color: var(--muted);
    background: transparent; border: 0; border-radius: 4px; padding: 2px 10px; cursor: pointer;
  }
  .lang button[aria-pressed="true"] { background: #fff; color: var(--text); box-shadow: 0 1px 2px rgba(15, 15, 15, 0.12); }
  .lang button:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }

  /* Hero: text on the left, Bajtek (the guide from the games) on the right */
  .hero { display: grid; grid-template-columns: 1fr auto; gap: 8px 28px; align-items: center; padding: 28px 0 4px; }
  .hero .mascot { display: block; width: auto; height: 210px; }
  .cta { margin: 20px 0 0; }

  h1 { font-size: 40px; font-weight: 700; line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 12px; text-wrap: balance; }
  h2 { font-size: 22px; font-weight: 600; margin: 44px 0 6px; letter-spacing: -0.01em; }
  .lead { font-size: 18px; color: var(--muted); margin: 0 0 14px; max-width: 620px; text-wrap: pretty; }
  .author { margin: 0; font-size: 15px; }
  .author a { margin-left: 8px; }
  .section-lead { color: var(--muted); margin: 0 0 16px; text-wrap: pretty; }

  .facts { display: flex; flex-wrap: wrap; gap: 6px; margin: 18px 0 0; padding: 0; list-style: none; }
  .facts li { font-size: 13px; font-weight: 500; border-radius: 4px; padding: 2px 9px; background: var(--gray); color: var(--muted); }

  /* Buttons: glossy and raised like the tiles; they lift on hover and press down on click */
  .btn {
    font: inherit; font-size: 15px; font-weight: 500; text-decoration: none; border-radius: 10px; padding: 8px 15px 10px;
    color: #fff; display: inline-flex; align-items: center; gap: 6px; text-shadow: 0 1px 0 rgba(0, 0, 0, 0.18);
    background: var(--blue);
    background: linear-gradient(180deg, color-mix(in srgb, var(--blue), #fff 14%) 0%, var(--blue) 50%, color-mix(in srgb, var(--blue), #000 10%) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.35),
      inset 0 -3px 0 color-mix(in srgb, var(--blue), #000 28%),
      0 6px 14px -6px color-mix(in srgb, var(--blue), #000 15%),
      0 1px 2px rgba(15, 15, 15, 0.15);
    transition: transform 0.12s, box-shadow 0.12s, filter 0.12s;
  }
  .btn:hover {
    transform: translateY(-1px); filter: brightness(0.94);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.35),
      inset 0 -3px 0 color-mix(in srgb, var(--blue), #000 28%),
      0 10px 18px -8px color-mix(in srgb, var(--blue), #000 15%),
      0 1px 2px rgba(15, 15, 15, 0.15);
  }
  .btn:active {
    transform: translateY(1px);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.25),
      inset 0 -1px 0 color-mix(in srgb, var(--blue), #000 28%),
      0 2px 4px -2px color-mix(in srgb, var(--blue), #000 15%);
  }
  .btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .btn-lg { font-size: 16px; padding: 11px 19px 13px; border-radius: 12px; }

  /* Learning path: an overview of the four steps; each step jumps to its game card */
  .path { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 20px; }
  .path li { position: relative; }
  .path a {
    position: relative; overflow: hidden; display: block; height: 100%; border-radius: 14px; padding: 12px 13px 14px;
    color: var(--text); text-decoration: none; background: var(--tint);
    background: linear-gradient(180deg, color-mix(in srgb, var(--tint), #fff 30%) 0%, var(--tint) 55%, color-mix(in srgb, var(--tint), #000 5%) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.9),
      inset 0 -4px 0 color-mix(in srgb, var(--tint), #000 9%),
      0 8px 16px -6px color-mix(in srgb, var(--tint), #000 38%),
      0 1px 2px rgba(15, 15, 15, 0.08);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  /* glossy highlight, like light on Bajtek's shell */
  .path a::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(90% 55% at 22% 0%, rgba(255, 255, 255, 0.45), transparent 70%);
  }
  .path a > span { position: relative; }
  .path a:hover {
    transform: translateY(-2px);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.9),
      inset 0 -4px 0 color-mix(in srgb, var(--tint), #000 9%),
      0 12px 22px -8px color-mix(in srgb, var(--tint), #000 42%),
      0 1px 2px rgba(15, 15, 15, 0.08);
  }
  .path a:active {
    transform: translateY(1px);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.9),
      inset 0 -2px 0 color-mix(in srgb, var(--tint), #000 9%),
      0 3px 6px -3px color-mix(in srgb, var(--tint), #000 38%);
  }
  .path a:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .path .num { display: block; font-size: 12px; font-weight: 600; color: var(--on-tint); }
  .path .verb { display: block; font-weight: 700; font-size: 17px; }
  .path .game-name { display: block; font-size: 13px; color: var(--on-tint); margin-top: 2px; }
  .path li:not(:last-child)::after {
    content: "→"; position: absolute; right: -10px; top: 50%; transform: translate(50%, -50%);
    color: var(--faint); font-size: 14px;
  }

  /* Game cards: a top in the step's color with Bajtek in a fitting mood, then the details */
  .games { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .game {
    position: relative; scroll-margin-top: 16px;
    border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column;
    box-shadow: 0 1px 2px rgba(15, 15, 15, 0.04); transition: box-shadow 0.15s, border-color 0.15s, transform 0.15s;
  }
  .game:hover { border-color: #dcdcd9; box-shadow: 0 6px 18px rgba(15, 15, 15, 0.09); transform: translateY(-2px); }
  .game .top {
    position: relative; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; min-height: 120px; padding: 14px 18px 0;
    background: var(--tint);
    background: linear-gradient(180deg, color-mix(in srgb, var(--tint), #fff 28%) 0%, var(--tint) 55%, color-mix(in srgb, var(--tint), #000 7%) 100%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9), inset 0 -12px 18px -14px color-mix(in srgb, var(--tint), #000 45%);
  }
  .game .top::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(70% 60% at 18% 0%, rgba(255, 255, 255, 0.4), transparent 70%);
  }
  .game .top .label, .game .top .stage { position: relative; }
  /* soft shadow on the "floor" under Bajtek's feet */
  .game .top .stage::before {
    content: ""; position: absolute; left: 50%; bottom: 1px; width: 74%; height: 12px; transform: translateX(-50%);
    border-radius: 50%; background: radial-gradient(closest-side, color-mix(in srgb, var(--tint), #000 35%), transparent);
    transition: transform 0.2s, opacity 0.2s;
  }
  .game:hover .top .stage::before { transform: translateX(-50%) scale(0.85); opacity: 0.7; }
  .game .top .label { align-self: center; }
  .game .top .num { display: block; font-size: 12px; font-weight: 600; color: var(--on-tint); }
  .game .top .verb { display: block; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .game .top img { position: relative; display: block; width: auto; height: 106px; transform-origin: 50% 100%; transition: transform 0.2s; }
  .game:hover .top img { transform: translateY(-3px) rotate(-3deg); }
  .game .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .game h3 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
  .game p { margin: 0; color: var(--muted); font-size: 15px; }
  .game .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
  .game .meta span { font-size: 12px; font-weight: 500; border-radius: 4px; padding: 1px 7px; background: var(--gray); color: var(--muted); }
  .game .play { margin-top: auto; padding-top: 8px; }
  /* The Play link stretches over the whole card, so a click anywhere on it starts the game */
  .game .play a::after { content: ""; position: absolute; inset: 0; }

  /* Principles */
  .principles { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .principles li { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; }
  .principles .ico { font-size: 20px; line-height: 1.3; }
  .principles strong { display: block; font-weight: 600; }
  .principles p { margin: 2px 0 0; color: var(--muted); }

  footer { margin-top: 44px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  footer a { color: var(--muted); }

  @media (max-width: 640px) {
    .hero { grid-template-columns: 1fr; padding-top: 16px; }
    .hero .mascot { height: 120px; order: -1; }
    .path { grid-template-columns: 1fr 1fr; }
    .path li:nth-child(2)::after { content: none; }
    .games, .principles { grid-template-columns: 1fr; }
    .game .top { min-height: 104px; }
    .game .top img { height: 92px; }
  }
  @media (max-width: 480px) {
    body { padding-top: 16px; }
    h1 { font-size: 31px; }
    .lead { font-size: 17px; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { transition: none !important; animation: none !important; }
    .game:hover, .game:hover .top img, .path a:hover, .path a:active, .btn:hover, .btn:active { transform: none; }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="logo" id="logo">AI <span class="ai">w pracy</span></div>
    <div class="lang" id="lang" role="group" aria-label="Język / Language">
      <button type="button" data-lang="pl" aria-pressed="true">PL</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>
  <main id="page"></main>
  <footer id="footer"></footer>
</div>

<script>
// Who made this. Anything left empty is simply not shown.
const AUTHOR = {
  name: "",
  role: { pl: "", en: "" },
  linkedin: "",
  email: ""
};

const GITHUB = "https://github.com/kian09j";

// The games, in the order of the learning path. Paths are relative to kian09j.github.io.
// mood: which Bajtek picture (bajtek/<mood>.png) shows on the game card.
const GAMES = [
  { path: "/mysl_jak_ai/", repo: "mysl_jak_ai", mood: "think",
    pl: { name: "Myśl jak AI", verb: "Zrozum", what: "Jak AI pisze teksty: zgaduje kolejne słowo. Stąd przewidywalne maile, losowość, rola kontekstu i halucynacje.", meta: ["13 rund", "5 minut", "Zgadywanie"] },
    en: { name: "Think like AI", verb: "Understand", what: "How AI writes: it predicts the next word. That explains predictable emails, randomness, why context matters and hallucinations.", meta: ["13 rounds", "5 minutes", "Guessing"] } },
  { path: "/popraw_polecenie/", repo: "popraw_polecenie", mood: "happy",
    pl: { name: "Popraw polecenie", verb: "Pisz", what: "Jak pisać dobre polecenia: fakty, odbiorca, format, źródło. I dlaczego „jesteś ekspertem” albo napiwek niewiele dają.", meta: ["4 zadania", "5 minut", "Budowanie polecenia"] },
    en: { name: "Fix the prompt", verb: "Write", what: "How to write good prompts: facts, audience, format, source. And why “you are an expert” or a tip doesn't do much.", meta: ["4 tasks", "5 minutes", "Building a prompt"] } },
  { path: "/zlap_halucynacje/", repo: "zlap_halucynacje", mood: "oops",
    pl: { name: "Złap halucynację", verb: "Sprawdzaj", what: "Jak sprawdzać teksty od AI: pomylone liczby, zmyślone badania i cytaty, zgubione warunki, szczegóły spoza źródła.", meta: ["4 teksty", "5 minut", "Szukanie błędów"] },
    en: { name: "Catch the hallucination", verb: "Check", what: "How to check what AI writes: wrong numbers, made-up studies and quotes, dropped conditions, details that aren't in the source.", meta: ["4 texts", "5 minutes", "Spot the error"] } },
  { path: "/czy_moge_to_wkleic/", repo: "czy_moge_to_wkleic", mood: "idle",
    pl: { name: "Czy mogę to wkleić?", verb: "Chroń dane", what: "Bezpieczeństwo danych: co można wkleić do AI, co tylko do firmowego narzędzia, a czego nigdzie.", meta: ["10 sytuacji", "4 minuty", "Sortowanie"] },
    en: { name: "Can I paste this?", verb: "Protect data", what: "Data safety: what you can paste into AI, what belongs only in your company's tool, and what never goes in.", meta: ["10 situations", "4 minutes", "Sorting"] } }
];

const PATH_TINTS = ["#fadec9", "#e8deee", "#fbf3db", "#edf3ec"];

const TEXT = {
  pl: {
    title: "AI w pracy",
    logo: 'AI <span class="ai">w pracy</span>',
    h1: "Gry, które uczą pracy z AI",
    cta: "Zacznij od pierwszej gry",
    lead: "Cztery krótkie gry szkoleniowe dla osób, które na co dzień pracują przy komputerze. Każda trwa około 5 minut, działa w przeglądarce i uczy jednej umiejętności potrzebnej przy pracy z Copilotem albo ChatGPT.",
    facts: ["4 gry", "około 20 minut w sumie", "polski i angielski", "działa na telefonie"],
    by: "Autorka:",
    gamesTitle: "Gry",
    step: "Krok",
    play: "Zagraj",
    code: "Kod",
    pathTitle: "Ścieżka nauki",
    pathLead: "Razem tworzą jedną ścieżkę: od zrozumienia, jak działa AI, do bezpiecznej codziennej pracy z nim. Można je przejść samodzielnie albo użyć jako ćwiczeń na warsztacie.",
    principlesTitle: "Jak zaprojektowano te gry",
    principles: [
      ["🎯", "Najpierw działasz, potem rozumiesz", "Gracz zgaduje, wybiera albo poprawia, a dopiero potem widzi wynik i krótkie wyjaśnienie. To zostaje w głowie dłużej niż wykład."],
      ["⏱️", "Krótko i o jednej rzeczy", "Każda gra trwa około 5 minut i uczy jednej umiejętności. Na końcu jest ściągawka do zabrania do pracy."],
      ["📎", "Przykłady z prawdziwej pracy", "Maile do klientów, notatki ze spotkań, regulaminy i ogłoszenia, a nie abstrakcyjne zagadki."],
      ["🌍", "Dla każdego", "Dwa języki, działa na telefonie i z klawiatury, bez logowania i instalowania czegokolwiek."]
    ],
    footer: "Wszystkie gry są otwarte, a ich kod jest na GitHubie."
  },
  en: {
    title: "AI at work",
    logo: 'AI <span class="ai">at work</span>',
    h1: "Games that teach people to work with AI",
    cta: "Start with the first game",
    lead: "Four short training games for people who work at a computer every day. Each one takes about 5 minutes, runs in the browser and teaches one skill you need when working with Copilot or ChatGPT.",
    facts: ["4 games", "about 20 minutes in total", "Polish and English", "works on phones"],
    by: "By",
    gamesTitle: "Games",
    step: "Step",
    play: "Play",
    code: "Code",
    pathTitle: "Learning path",
    pathLead: "Together they form one path: from understanding how AI works to using it safely every day. Play them on your own or use them as exercises in a workshop.",
    principlesTitle: "How the games are designed",
    principles: [
      ["🎯", "Do first, understand second", "Players guess, choose or fix something, and only then see the result and a short explanation. That sticks longer than a lecture."],
      ["⏱️", "Short, and about one thing", "Each game takes about 5 minutes and teaches one skill. It ends with a cheat sheet to take back to work."],
      ["📎", "Examples from real work", "Customer emails, meeting notes, policies and job ads, not abstract puzzles."],
      ["🌍", "For everyone", "Two languages, works on phones and with a keyboard, no sign-up and nothing to install."]
    ],
    footer: "All the games are free to play, and their code is on GitHub."
  }
};

let lang = "pl";
let T = TEXT.pl;
const $ = (id) => document.getElementById(id);

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

const MASCOT = `<img class="mascot" src="bajtek/idle.png" alt="" width="248" height="288">`;

function authorHTML() {
  if (!AUTHOR.name) return "";
  const role = AUTHOR.role[lang] ? ` · ${esc(AUTHOR.role[lang])}` : "";
  const links = [
    AUTHOR.linkedin ? `<a href="${esc(AUTHOR.linkedin)}">LinkedIn</a>` : "",
    AUTHOR.email ? `<a href="mailto:${esc(AUTHOR.email)}">${esc(AUTHOR.email)}</a>` : ""
  ].join("");
  return `<p class="author">${esc(T.by)} <strong>${esc(AUTHOR.name)}</strong>${role}${links}</p>`;
}

function render() {
  const first = GAMES[0];
  $("page").innerHTML = `
    <section class="hero">
      <div>
        <h1>${esc(T.h1)}</h1>
        <p class="lead">${esc(T.lead)}</p>
        ${authorHTML()}
        <p class="cta"><a class="btn btn-lg" href="${first.path}?lang=${lang}">${esc(T.cta)} →</a></p>
        <ul class="facts">${T.facts.map((f) => `<li>${esc(f)}</li>`).join("")}</ul>
      </div>
      ${MASCOT}
    </section>

    <h2>${esc(T.pathTitle)}</h2>
    <p class="section-lead">${esc(T.pathLead)}</p>
    <ol class="path">
      ${GAMES.map((g, i) => `<li style="--tint:${PATH_TINTS[i]}"><a href="#game-${i + 1}"><span class="num">${esc(T.step)} ${i + 1}</span><span class="verb">${esc(g[lang].verb)}</span><span class="game-name">${esc(g[lang].name)}</span></a></li>`).join("")}
    </ol>

    <h2>${esc(T.gamesTitle)}</h2>
    <div class="games">
      ${GAMES.map((g, i) => {
        const d = g[lang];
        return `
        <article class="game" id="game-${i + 1}" style="--tint:${PATH_TINTS[i]}">
          <div class="top">
            <div class="label"><span class="num">${esc(T.step)} ${i + 1}</span><span class="verb">${esc(d.verb)}</span></div>
            <span class="stage"><img src="bajtek/${g.mood}.png" alt="" loading="lazy" width="248" height="288"></span>
          </div>
          <div class="body">
            <h3>${esc(d.name)}</h3>
            <p>${esc(d.what)}</p>
            <div class="meta">${d.meta.map((m) => `<span>${esc(m)}</span>`).join("")}</div>
            <div class="play"><a class="btn" href="${g.path}?lang=${lang}" aria-label="${esc(T.play)}: ${esc(d.name)}">${esc(T.play)} →</a></div>
          </div>
        </article>`;
      }).join("")}
    </div>

    <h2>${esc(T.principlesTitle)}</h2>
    <ul class="principles">
      ${T.principles.map(([ico, t, d]) => `<li><span class="ico" aria-hidden="true">${ico}</span><div><strong>${esc(t)}</strong><p>${esc(d)}</p></div></li>`).join("")}
    </ul>`;
  $("footer").innerHTML = `${esc(T.footer)} <a href="${GITHUB}">github.com/kian09j</a>`;
}

function readSavedLang() {
  try { return localStorage.getItem("lang"); } catch (e) { return null; }
}

// The language choice is shared with the games, which live on the same site.
function setLang(l) {
  lang = l === "en" ? "en" : "pl";
  T = TEXT[lang];
  document.documentElement.lang = lang;
  document.title = T.title;
  $("logo").innerHTML = T.logo;
  document.querySelectorAll("#lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  try { localStorage.setItem("lang", lang); } catch (e) { /* storage unavailable */ }
  render();
}

document.querySelectorAll("#lang button").forEach((b) => b.addEventListener("click", () => setLang(b.dataset.lang)));

const urlLang = new URLSearchParams(location.search).get("lang");
setLang(urlLang === "en" || urlLang === "pl" ? urlLang : readSavedLang() || "pl");
</script>
</body>
</html>
